<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manas Dubey – Full Stack Developer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F7F8FB;--panel:#FFFFFF;--ink:#101828;--mute:#5B6478;--line:#E4E7EE;--acc:#5B5BF0;--acc2:#8B5CF6;--accbg:#EEEEFE;--ok:#0E9F6E;--bad:#D9480F;--glow:rgba(91,91,240,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0B0D12;--panel:#12151D;--ink:#EDEFF5;--mute:#98A0B3;--line:#242938;--acc:#8B8BFF;--acc2:#B497FF;--accbg:#1B1E36;--ok:#3DD69B;--bad:#FB923C;--glow:rgba(139,139,255,.18)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.65 Geist,system-ui,sans-serif;transition:background .25s,color .25s}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.03em;font-weight:700}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
.bar{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{display:flex;justify-content:space-between;align-items:center;height:64px;gap:12px}
nav b{font-weight:700;font-size:18px;letter-spacing:-.02em}
.links{display:flex;gap:4px;align-items:center}
.links a{text-decoration:none;color:var(--mute);font-size:15px;padding:6px 12px;border-radius:8px}
.links a:hover{color:var(--ink);background:var(--accbg)}
.right{display:flex;gap:8px;align-items:center}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon:hover{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;font:600 15.5px Geist,sans-serif;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.btn.p:hover{filter:brightness(1.07)}
.hero{position:relative;padding:72px 0 64px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-120px 0 auto;height:460px;background:radial-gradient(60% 60% at 30% 30%,var(--glow),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:500;padding:5px 14px;border-radius:99px;background:var(--accbg);color:var(--acc)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:block}
.hero h1{font-size:clamp(40px,6.4vw,72px);font-weight:800;margin:20px 0 18px}
.grad{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);max-width:50ch;margin:0 0 28px;font-size:18px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.rel{padding:0;overflow:hidden;box-shadow:0 20px 50px -20px var(--glow),0 2px 6px rgba(16,24,40,.05)}
.rel header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.rel ul{list-style:none;margin:0;padding:6px 0}
.rel li{display:flex;justify-content:space-between;padding:8px 18px;font-size:15px}
.st{font-weight:600;font-size:14px}
.st.queued{color:var(--mute)}.st.deploying{color:var(--acc)}.st.healthy{color:var(--ok)}.st.rolled{color:var(--bad)}
.log{padding:11px 18px;font-size:14px;color:var(--mute);border-top:1px solid var(--line);min-height:46px}
.rel footer{display:flex;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;font-size:14px;color:var(--mute)}
.rel label{display:flex;gap:6px;align-items:center;cursor:pointer}
.rel .btn{padding:8px 16px;font-size:14.5px}.rel .btn:disabled{opacity:.55;cursor:default}
section{padding:64px 0}
h2{font-size:clamp(28px,4vw,42px);margin-bottom:10px}
.sub{color:var(--mute);max-width:56ch;margin:0 0 32px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card h3{font-size:19px;margin-bottom:8px;letter-spacing:-.02em}
.card p{margin:0;color:var(--mute);font-size:15.5px}
.ico{width:40px;height:40px;border-radius:10px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;margin-bottom:14px}
.job{display:grid;grid-template-columns:220px 1fr;gap:32px}
.job h3{font-size:24px}
.meta{color:var(--mute);font-size:15px;margin-top:6px}
.award{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:600;padding:3px 12px;border-radius:99px;background:var(--accbg);color:var(--acc)}
.job ul{margin:0 0 14px;padding-left:20px}.job li{margin-bottom:12px;max-width:66ch}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tags span{font-size:14px;padding:3px 12px;border-radius:99px;background:var(--accbg);color:var(--acc);font-weight:500}
.proj{display:flex;flex-direction:column;gap:12px;transition:transform .2s,border-color .2s}
.proj:hover{transform:translateY(-3px);border-color:var(--acc)}
.proj small{font-size:13px;font-weight:600;color:var(--mute)}
.proj p{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stat{text-align:center}
.stat b{display:block;font-size:clamp(36px,5vw,54px);font-weight:800;letter-spacing:-.04em;line-height:1.1}
.stat span{color:var(--mute);font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two ul{margin:0;padding-left:20px}.two li{margin-bottom:6px}
.contact{text-align:center}
.contact .card{padding:52px 22px;background:linear-gradient(135deg,var(--accbg),var(--panel))}
.contact .sub{margin:0 auto 26px}
.contact .btns{justify-content:center}
footer.end{padding:28px 0;color:var(--mute);font-size:14px;border-top:1px solid var(--line);text-align:center}
@media (max-width:820px){.hero .wrap,.job,.two,.grid3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr;row-gap:28px}.links{display:none}.hero{padding-top:44px}.job{gap:14px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useRef,useEffect}=React;
const html=htm.bind(React.createElement);
const SERVICES=["corporate-actions","trade-interface","rules-engine","messaging","file-ingest","reporting"];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

function useTheme(){
  const [t,setT]=useState(()=>{
    let s=null;try{s=localStorage.getItem("theme")}catch(e){}
    return s||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  });
  useEffect(()=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}},[t]);
  return [t,()=>setT(x=>x==="dark"?"light":"dark")];
}
const Sun=()=>html`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const Moon=()=>html`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
const I=(d)=>html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d=${d}/></svg>`;

function Release(){
  const init=()=>Object.fromEntries(SERVICES.map(s=>[s,"queued"]));
  const [st,setSt]=useState(init),[fail,setFail]=useState(false),[busy,setBusy]=useState(false);
  const [log,setLog]=useState("Ready to release v2.4.0.");
  const alive=useRef(true);
  useEffect(()=>()=>{alive.current=false},[]);
  const set=(s,v)=>setSt(o=>({...o,[s]:v}));
  async function run(){
    setBusy(true);setSt(init());setLog("Starting release v2.4.0…");const done=[];
    for(const s of SERVICES){
      if(!alive.current)return;
      set(s,"deploying");setLog("Deploying "+s+"…");await wait(650);
      if(fail&&s==="messaging"){
        setLog("Health check failed on messaging. Rolling back.");
        for(const d of [...done,s].reverse()){set(d,"rolled");await wait(300)}
        setLog("Rolled back to v2.3.9. No downtime.");setBusy(false);return;
      }
      set(s,"healthy");done.push(s);
    }
    setLog("All services healthy. Released with zero downtime.");setBusy(false);
  }
  const label={queued:"queued",deploying:"deploying",healthy:"healthy",rolled:"rolled back"};
  return html`<div class="card rel" aria-live="polite">
    <header><span>Release console</span><span class="dots"><i></i><i></i><i></i></span></header>
    <ul>${SERVICES.map(s=>html`<li key=${s}><span>${s}</span><span class=${"st "+st[s]}>${label[st[s]]}</span></li>`)}</ul>
    <div class="log">${log}</div>
    <footer><button class="btn p" onClick=${run} disabled=${busy}>${busy?"Releasing…":"Run release"}</button>
    <label><input type="checkbox" checked=${fail} disabled=${busy} onChange=${e=>setFail(e.target.checked)}/> Fail a health check</label></footer>
  </div>`;
}

function Count({to,suffix}){
  const [n,setN]=useState(reduce?to:0),ref=useRef(null);
  useEffect(()=>{
    if(reduce||!("IntersectionObserver" in window)){setN(to);return}
    const io=new IntersectionObserver(([e])=>{
      if(!e.isIntersecting)return;io.disconnect();
      const t0=performance.now();
      const tick=t=>{const p=Math.min((t-t0)/1200,1);setN(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(tick)};
      requestAnimationFrame(tick);
    },{threshold:.4});
    io.observe(ref.current);return()=>io.disconnect();
  },[to]);
  return html`<b class="grad" ref=${ref}>${n}${suffix}</b>`;
}

const JOB=[
 "Built and enhanced the Corporate Actions module (interfaces, trades, rules, messaging) in TCS BaNCS, supporting 10+ global clients and improving the accuracy of financial event processing.",
 "Resolved 350+ production issues (2–3 a day), including critical defects with potential financial impact, through root cause analysis and fixes.",
 "Built and optimized Spring Batch jobs with S3 integration for high-volume processing, making file handling 95% faster.",
 "Designed Linux-based deployment automation for 20+ microservices with health checks, rollback and versioning for zero-downtime releases.",
 "Automated rule and script development with macros and AI agents, cutting manual effort by 80% and shortening delivery from 1 week to 1 day.",
 "Worked with international clients and delivered 2–3 change requests a month over 6 months.",
 "Led client meetings on my own to clarify requirements, discuss solutions and coordinate delivery when senior stakeholders were unavailable.",
 "Wrote technical documentation for REST APIs, PostgreSQL schemas and service workflows, which improved onboarding efficiency by 40%."
];
const PROJECTS=[
 ["ShopEase Complaint Autobot","AI automation","Analyzes incoming customer complaints, classifies the issue, sets priority and escalation, and sends automated replies. Supabase stores complaints, contacts, responses and escalation status. Includes a React chat interface with message history, preset scenarios and email collection.",["React.js","n8n","Supabase","Gemini API","Gmail"]],
 ["Transport Management System","Full stack","A real-time system to track buses, manage students and allocate routes automatically by location. Backend logic and optimized queries make allocation faster and reduce manual scheduling.",["AngularJS","PHP","MySQL"]],
 ["Andy AI Chrome Extension","Chrome extension","A Gemini-powered extension that gives real-time YouTube summaries and insights. It extracts page content and generates highlights automatically.",["JavaScript","Gemini API"]]
];
const SKILLS=[
 ["Languages",["Java","JavaScript","Python","SQL"]],
 ["Front end",["React.js","AngularJS","JavaScript"]],
 ["Backend",["Spring Boot","Spring Batch","Microservices","REST APIs"]],
 ["Databases",["MySQL","Data modeling","Query optimization"]],
 ["Cloud and DevOps",["AWS","Docker","Jenkins","CI/CD"]],
 ["Architecture and tools",["Event-driven systems","Redis caching","Scalability","Git","Linux","Monitoring","Troubleshooting"]]
];

function App(){
  const [theme,toggle]=useTheme();
  const [all,setAll]=useState(false);
  return html`
  <div class="bar"><div class="wrap"><nav>
    <b>Manas Dubey</b>
    <div class="links"><a href="#about">About</a><a href="#work">Experience</a><a href="#skills">Skills</a><a href="#projects">Projects</a></div>
    <div class="right">
      <button class="icon" onClick=${toggle} aria-label=${theme==="dark"?"Switch to light mode":"Switch to dark mode"} title="Toggle theme">${theme==="dark"?html`<${Sun}/>`:html`<${Moon}/>`}</button>
      <a class="btn p" href="#contact">Contact</a>
    </div>
  </nav></div></div>

  <header class="hero"><div class="wrap">
    <div>
      <span class="pill"><i></i>Open to opportunities</span>
      <h1>Hi, I'm Manas. I build <span class="grad">reliable software</span> for finance.</h1>
      <p>Full stack developer with 2+ years at Tata Consultancy Services. I work with Java, Spring Boot and microservices, and I build React and AI projects on the side.</p>
      <div class="btns"><a class="btn p" href="#projects">View projects</a><a class="btn" href="#contact">Get in touch</a></div>
    </div>
    <${Release}/>
  </div></header>

  <section id="about"><div class="wrap">
    <h2>What I do</h2><p class="sub">I work on enterprise financial applications where accuracy and uptime matter.</p>
    <div class="grid3">
      <div class="card"><div class="ico">${I("M4 6h16M4 12h16M4 18h16")}</div><h3>Backend engineering</h3><p>Microservices, REST APIs and Spring Batch jobs that process large volumes of financial data.</p></div>
      <div class="card"><div class="ico">${I("M3 5h18v12H3zM8 21h8")}</div><h3>Front end</h3><p>React.js and AngularJS interfaces, including a chat interface for customer support.</p></div>
      <div class="card"><div class="ico">${I("M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z")}</div><h3>AI applications</h3><p>Complaint handling and a Chrome extension built on the Gemini API, with n8n workflows.</p></div>
    </div>
  </div></section>

  <section><div class="wrap"><div class="stats">
    <div class="stat"><${Count} to=${350} suffix="+"/><span>production issues resolved</span></div>
    <div class="stat"><${Count} to=${95} suffix="%"/><span>faster file handling</span></div>
    <div class="stat"><${Count} to=${80} suffix="%"/><span>less manual effort</span></div>
    <div class="stat"><${Count} to=${20} suffix="+"/><span>microservices with automated deploys</span></div>
  </div></div></section>

  <section id="work"><div class="wrap">
    <h2>Experience</h2><p class="sub">Building and running enterprise financial software.</p>
    <div class="card job">
      <div><h3>TCS</h3><div class="meta">Backend Engineer, Capital Markets<br/>Dec 2023 to present<br/>Gurugram, India</div><span class="award">Employee of the Year</span></div>
      <div><ul>${(all?JOB:JOB.slice(0,4)).map((t,i)=>html`<li key=${i}>${t}</li>`)}</ul>
        <button class="btn" onClick=${()=>setAll(!all)} aria-expanded=${all}>${all?"Show less":"Show all "+JOB.length+" highlights"}</button></div>
    </div>
  </div></section>

  <section id="skills"><div class="wrap">
    <h2>Technical skills</h2><p class="sub">Technologies I use in my work and projects.</p>
    <div class="grid3">${SKILLS.map(([k,v])=>html`<div class="card" key=${k}><h3>${k}</h3><div class="tags">${v.map(x=>html`<span key=${x}>${x}</span>`)}</div></div>`)}</div>
  </div></section>

  <section id="projects"><div class="wrap">
    <h2>Projects</h2><p class="sub">Full stack development combined with AI and automation.</p>
    <div class="grid3">${PROJECTS.map(([n,k,d,t])=>html`<article class="card proj" key=${n}><small>${k}</small><h3>${n}</h3><p>${d}</p><div class="tags">${t.map(x=>html`<span key=${x}>${x}</span>`)}</div></article>`)}</div>
  </div></section>

  <section><div class="wrap two">
    <div class="card"><h3>Recognition</h3><ul>
      <li>Employee of the Year, TCS</li><li>Employee of the Month, 5 times, TCS</li>
      <li>Top 100, Innovate India Coding Championship (AICTE)</li><li>4-star competitive programmer on CodeChef</li></ul></div>
    <div class="card"><h3>Education</h3><p>B.Tech in Computer Science and Engineering<br/>United College of Engineering and Research, Prayagraj<br/>2019 to 2023, GPA 8.49/10</p></div>
  </div></section>

  <section id="contact" class="contact"><div class="wrap"><div class="card">
    <h2>Let's work together</h2><p class="sub">I'm open to new roles and collaborations. Email is the fastest way to reach me.</p>
    <div class="btns"><a class="btn p" href="mailto:dmanas760@gmail.com">dmanas760@gmail.com</a><a class="btn" href="https://linkedin.com/in/manasdubey7">LinkedIn</a><a class="btn" href="tel:+917355517514">+91 73555 17514</a></div>
  </div></div></section>
  <footer class="end"><div class="wrap">© 2026 Manas Dubey</div></footer>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
